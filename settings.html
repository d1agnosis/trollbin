<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки профиля - TrollBin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #0d0d0d; color: #e0e0e0; font-family: Arial, sans-serif; margin: 0; padding-top: 80px; }
        .settings-wrapper { max-width: 600px; margin: 30px auto; background: #141414; border: 1px solid #222; border-radius: 4px; padding: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #888; font-size: 14px; }
        .form-group input[type="text"], .form-group textarea { width: 100%; padding: 10px; background: #0a0a0a; border: 1px solid #333; border-radius: 4px; color: #fff; font-family: Arial, sans-serif; box-sizing: border-box; }
        .form-group textarea { resize: vertical; height: 100px; }
        
        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .file-upload-btn {
            background: #1a0a0a;
            border: 1px solid #ff3333;
            color: #ff3333;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            cursor: pointer;
            transition: 0.2s;
            display: inline-block;
            text-align: center;
        }
        .file-upload-btn:hover {
            background: #2a0a0a;
            color: #ff5252;
        }
        .file-upload-input {
            display: none;
        }
        .file-name-display {
            font-size: 12px;
            color: #888;
            font-family: Arial, sans-serif;
            word-break: break-all;
        }

        .color-picker-wrapper { display: flex; align-items: center; gap: 10px; }
        .form-group input[type="color"] { -webkit-appearance: none; border: none; width: 40px; height: 40px; border-radius: 4px; cursor: pointer; background: none; }
        .form-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .form-group input[type="color"]::-webkit-color-swatch { border: 1px solid #333; border-radius: 4px; }

        .reset-btn { background: transparent; border: 1px solid #ff3333; color: #ff3333; padding: 5px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; margin-top: 8px; transition: 0.2s; }
        .reset-btn:hover { background: #220000; }

        .save-btn { background: #ff3333; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .save-btn:hover { background: #e02e2e; }
    </style>
</head>
<body>

    <div class="settings-wrapper">
        <h2 style="margin-top: 0; color: #fff; font-size: 20px; margin-bottom: 20px;">Настройки аккаунта</h2>
        <form id="settingsForm">
            <div class="form-group">
                <label>Никнейм</label>
                <input type="text" id="nicknameInput" required>
            </div>
            
            <div class="form-group">
                <label>Цвет никнейма</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="nicknameColorInput" value="#61b5ff">
                    <span style="font-size: 12px; color: #888;">Выберите цвет отображения вашего ника в профиле и комментариях</span>
                </div>
            </div>

            <div class="form-group">
                <label>Аватарка (выберите файл с компьютера)</label>
                <div class="file-upload-wrapper">
                    <label class="file-upload-btn">
                        Выбрать файл
                        <input type="file" id="avatarFile" class="file-upload-input" accept="image/*">
                    </label>
                    <span id="avatarFileName" class="file-name-display">Файл не выбран</span>
                </div>
                <button type="button" class="reset-btn" onclick="resetAvatar()">Сбросить аватарку</button>
            </div>

            <div class="form-group">
                <label>Баннер / Шапка профиля (выберите файл с компьютера)</label>
                <div class="file-upload-wrapper">
                    <label class="file-upload-btn">
                        Выбрать файл
                        <input type="file" id="bannerFile" class="file-upload-input" accept="image/*">
                    </label>
                    <span id="bannerFileName" class="file-name-display">Файл не выбран</span>
                </div>
                <button type="button" class="reset-btn" onclick="resetBanner()">Сбросить баннер</button>
            </div>

            <div class="form-group">
                <label>Описание (Bio)</label>
                <textarea id="bioInput" placeholder="Расскажите о себе..."></textarea>
            </div>

            <button type="submit" class="save-btn">Сохранить изменения</button>
        </form>
    </div>

    <script>
        let newAvatarBase64 = '';
        let newBannerBase64 = '';
        let currentUserId = null;

        document.addEventListener("DOMContentLoaded", function() {
            currentUserId = localStorage.getItem('currentUserId') || (JSON.parse(localStorage.getItem('currentUser') || '{}')).id;
            if (!currentUserId) {
                window.location.href = 'login.html';
                return;
            }

            let users = JSON.parse(localStorage.getItem('users') || '[]');
            let user = users.find(u => String(u.id) === String(currentUserId));

            if (user) {
                document.getElementById('nicknameInput').value = user.nickname || '';
                document.getElementById('nicknameColorInput').value = user.nicknameColor || '#61b5ff';
                document.getElementById('bioInput').value = user.bio || '';
                newAvatarBase64 = user.avatar || '';
                newBannerBase64 = user.banner || '';
            }

            // Загрузка аватарки
            document.getElementById('avatarFile').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    document.getElementById('avatarFileName').textContent = file.name;
                    const reader = new FileReader();
                    reader.onload = function(uploadEvent) {
                        newAvatarBase64 = uploadEvent.target.result;
                    };
                    reader.readAsDataURL(file);
                } else {
                    document.getElementById('avatarFileName').textContent = 'Файл не выбран';
                }
            });

            // Загрузка баннера
            document.getElementById('bannerFile').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    document.getElementById('bannerFileName').textContent = file.name;
                    const reader = new FileReader();
                    reader.onload = function(uploadEvent) {
                        newBannerBase64 = uploadEvent.target.result;
                    };
                    reader.readAsDataURL(file);
                } else {
                    document.getElementById('bannerFileName').textContent = 'Файл не выбран';
                }
            });

            // Сохранение изменений
            document.getElementById('settingsForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const updatedData = {
                    id: currentUserId,
                    nickname: document.getElementById('nicknameInput').value.trim(),
                    nicknameColor: document.getElementById('nicknameColorInput').value,
                    avatar: newAvatarBase64,
                    banner: newBannerBase64,
                    bio: document.getElementById('bioInput').value.trim()
                };

                try {
                    // Отправка данных на бэкенд Vercel
                    const response = await fetch('/api/users', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedData)
                    });

                    if (!response.ok) {
                        console.warn("Сервер недоступен или ответил с ошибкой, сохраняем локально");
                    }

                    // Дублируем в localStorage для мгновенного отображения в интерфейсе
                    let usersList = JSON.parse(localStorage.getItem('users') || '[]');
                    let currentUser = usersList.find(u => String(u.id) === String(currentUserId));
                    
                    if (currentUser) {
                        Object.assign(currentUser, updatedData);
                        localStorage.setItem('users', JSON.stringify(usersList));
                        localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    }
                    
                    alert('Изменения успешно сохранены!');
                    window.location.href = 'profile.html?id=' + currentUserId;
                } catch (err) {
                    console.error(err);
                    alert('Ошибка при сохранении изменений.');
                }
            });
        });

        function resetAvatar() {
            newAvatarBase64 = '';
            document.getElementById('avatarFile').value = '';
            document.getElementById('avatarFileName').textContent = 'Файл не выбран';
            
            let usersList = JSON.parse(localStorage.getItem('users') || '[]');
            let currentUser = usersList.find(u => String(u.id) === String(currentUserId));
            if (currentUser) {
                currentUser.avatar = '';
                localStorage.setItem('users', JSON.stringify(usersList));
            }
            alert('Аватарка сброшена!');
        }

        function resetBanner() {
            newBannerBase64 = '';
            document.getElementById('bannerFile').value = '';
            document.getElementById('bannerFileName').textContent = 'Файл не выбран';
            
            let usersList = JSON.parse(localStorage.getItem('users') || '[]');
            let currentUser = usersList.find(u => String(u.id) === String(currentUserId));
            if (currentUser) {
                currentUser.banner = '';
                localStorage.setItem('users', JSON.stringify(usersList));
            }
            alert('Баннер сброшен!');
        }
    </script>
</body>
</html>
