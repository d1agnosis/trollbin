<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки профиля - TrollBin</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0d0d0d; color: #e0e0e0; font-family: Arial, sans-serif; margin: 0; padding-top: 80px; }
        .settings-wrapper { max-width: 600px; margin: 30px auto; background: #141414; border: 1px solid #222; border-radius: 4px; padding: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #888; font-size: 14px; }
        .form-group input[type="text"], .form-group textarea { width: 100%; padding: 10px; background: #0a0a0a; border: 1px solid #333; border-radius: 4px; color: #fff; font-family: Arial, sans-serif; box-sizing: border-box; }
        .form-group textarea { resize: vertical; height: 100px; }
        
        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .file-upload-btn {
            background: #1a0a0a;
            border: 1px solid #ff3333;
            color: #ff3333;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            cursor: pointer;
            transition: 0.2s;
            display: inline-block;
            text-align: center;
        }
        .file-upload-btn:hover {
            background: #2a0a0a;
            color: #ff5252;
        }
        .file-upload-input {
            display: none;
        }
        .file-name-display {
            font-size: 12px;
            color: #888;
            font-family: Arial, sans-serif;
            word-break: break-all;
        }

        .color-picker-wrapper { display: flex; align-items: center; gap: 10px; }
        .form-group input[type="color"] { -webkit-appearance: none; border: none; width: 40px; height: 40px; border-radius: 4px; cursor: pointer; background: none; }
        .form-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .form-group input[type="color"]::-webkit-color-swatch { border: 1px solid #333; border-radius: 4px; }

        .reset-btn { background: transparent; border: 1px solid #ff3333; color: #ff3333; padding: 5px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; margin-top: 8px; transition: 0.2s; }
        .reset-btn:hover { background: #220000; }

        .save-btn { background: #ff3333; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .save-btn:hover { background: #e02e2e; }
    </style>
</head>
<body>

    <div class="settings-wrapper">
        <h2 style="margin-top: 0; color: #fff; font-size: 20px; margin-bottom: 20px;">Настройки аккаунта</h2>
        <form id="settingsForm">
            <div class="form-group">
                <label>Никнейм</label>
                <input type="text" id="nicknameInput" required>
            </div>
            
            <div class="form-group">
                <label>Цвет никнейма</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="nicknameColorInput" value="#61b5ff">
                    <span style="font-size: 12px; color: #888;">Выберите цвет отображения вашего ника в профиле и комментариях</span>
                </div>
            </div>

            <div class="form-group">
                <label>Аватарка (выберите файл с компьютера)</label>
                <div class="file-upload-wrapper">
                    <label class="file-upload-btn">
                        Выбрать файл
                        <input type="file" id="avatarFile" class="file-upload-input" accept="image/*">
                    </label>
                    <span id="avatarFileName" class="file-name-display">Файл не выбран</span>
                </div>
                <button type="button" class="reset-btn" onclick="resetAvatar()">Сбросить аватарку</button>
            </div>

            <div class="form-group">
                <label>Баннер / Шапка профиля (выберите файл с компьютера)</label>
                <div class="file-upload-wrapper">
                    <label class="file-upload-btn">
                        Выбрать файл
                        <input type="file" id="bannerFile" class="file-upload-input" accept="image/*">
                    </label>
                    <span id="bannerFileName" class="file-name-display">Файл не выбран</span>
                </div>
                <button type="button" class="reset-btn" onclick="resetBanner()">Сбросить баннер</button>
            </div>

            <div class="form-group">
                <label>Описание (Bio)</label>
                <textarea id="bioInput" placeholder="Расскажите о себе..."></textarea>
            </div>

            <button type="submit" class="save-btn">Сохранить изменения</button>
        </form>
    </div>

    <script>
    // Инициализация Supabase
    const SUPABASE_URL = 'https://nkypmvnhaqowvrzliibi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5reXBtdmhucWFvdndyemxpaWJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTI5MzEsImV4cCI6MjEwNDQyODkzMX0.BMKSlLliqIqCY2-AXi0XCPuwuJYV5qyNs1skSA33jyk';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function openModal() {
        document.getElementById('infoModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('infoModal').style.display = 'none';
    }

    window.addEventListener('click', function(event) {
        const modal = document.getElementById('infoModal');
        if (event.target === modal) modal.style.display = 'none';
    });

    function toggleSidebar() {
        const sidebar = document.getElementById('leftSidebar');
        const toggleBtn = document.querySelector('.sidebar-toggle');
        sidebar.classList.toggle('open');
        toggleBtn.innerHTML = sidebar.classList.contains('open') ? '&#10094;' : '&#10095;';
    }

    // Автоматическая проверка авторизации для шапки
    document.addEventListener("DOMContentLoaded", async function() {
        const m = document.getElementById('authMenu');
        const currentUserId = localStorage.getItem('currentUserId');
        
        if (currentUserId && m) {
            try {
                const { data: u, error } = await _supabase
                    .from('users')
                    .select('*')
                    .eq('id', currentUserId)
                    .single();

                if (u && !error) {
                    let rawNick = u.nickname || u.username || u.name;
                    let displayNick = rawNick ? rawNick.replace(/^user_user_/i, 'user_') : "user_" + u.id;

                    m.innerHTML = '<a href="profile.html?id=' + u.id + '" style="color: #ff3333; font-family: Arial, sans-serif; font-weight: bold; font-size: 14px; text-decoration: none;">' + displayNick + '</a> <span style="color: #444;">/</span> <a href="#" id="logoutBtn" style="color: #888888; font-family: Arial, sans-serif; font-weight: bold; font-size: 14px; text-decoration: none;">Logout</a>';
                    
                    document.getElementById('logoutBtn').addEventListener('click', function(e) {
                        e.preventDefault();
                        localStorage.removeItem('currentUserId');
                        localStorage.removeItem('currentUser');
                        location.reload();
                    });
                }
            } catch(e) {}
        }
    });

    async function registerUser() {
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;

        if (!username || !password) {
            alert('Заполните все поля!');
            return;
        }

        const usernameRegex = /^[a-zA-Z0-9_.]+$/;
        if (!usernameRegex.test(username)) {
            alert('Недопустимые символы в никнейме!');
            return;
        }

        if (password.length < 8) {
            alert('Пароль слишком короткий (минимум 8 символов)!');
            return;
        }

        try {
            // Проверяем, не занято ли имя пользователя (точное совпадение через .eq)
            const { data: existingUsers, error: checkError } = await _supabase
                .from('users')
                .select('id, nickname')
                .eq('nickname', username);

            if (checkError) {
                throw checkError;
            }

            if (existingUsers && existingUsers.length > 0) {
                alert('Пользователь с таким именем уже существует!');
                return;
            }

            // Создаем нового пользователя в базе данных Supabase
            const newUserId = 'user_' + Date.now();
            const newUser = {
                id: newUserId,
                nickname: username,
                password: password,
                joined: new Date().toISOString()
            };

            const { error: insertError } = await _supabase
                .from('users')
                .insert([newUser]);

            if (insertError) {
                throw insertError;
            }

            // Сохраняем сессию локально
            localStorage.setItem('currentUserId', newUserId);
            localStorage.setItem('currentUser', JSON.stringify(newUser));

            alert('Регистрация успешна!');
            window.location.href = 'profile.html?id=' + newUserId;

        } catch (err) {
            console.error('Ошибка регистрации:', err);
            alert('Ошибка: ' + (err.message || JSON.stringify(err)));
        }
    }
</script>
</body>
</html>
