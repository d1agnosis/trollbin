<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrollBin - Регистрация</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #0b0b0b;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background: #111;
            border-right: 1px solid #ff3333;
            z-index: 2000;
            transition: left 0.3s ease;
            box-sizing: border-box;
            padding: 60px 20px 20px 20px;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar-toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            background: #0d0d0d;
            color: #ff3333;
            border: 1px solid #331111;
            border-radius: 4px;
            width: 32px;
            height: 32px;
            font-size: 14px;
            cursor: pointer;
            z-index: 2001;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .sidebar.open ~ .sidebar-toggle {
            left: 250px;
            border-left: 1px solid #331111;
            border-radius: 0 4px 4px 0;
        }
        .sidebar-toggle:hover {
            border-color: #ff3333;
            background: #141414;
        }
        .sidebar-nav-link {
            display: block;
            color: #888888;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 18px;
            text-decoration: none;
            margin-bottom: 20px;
            transition: color 0.2s ease;
        }
        .sidebar-nav-link.logo {
            color: #ff3333;
            font-size: 20px;
            margin-bottom: 30px;
        }
        .sidebar-nav-link:hover {
            color: #ff3333;
        }

        .register-box {
            background: #0d0d0d;
            border: 1px solid #331111;
            padding: 30px;
            border-radius: 6px;
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #ff3333;
            margin-bottom: 5px;
            font-weight: bold;
            font-family: monospace;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            background: #141414;
            border: 1px solid #331111;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
            font-family: monospace;
        }
        .form-group input:focus {
            border-color: #ff3333;
        }
        .register-btn {
            width: 100%;
            background: #220000;
            color: #ff3333;
            border: 1px solid #ff3333;
            padding: 10px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            margin-top: 10px;
        }
        .register-btn:hover {
            background: #ff3333;
            color: #fff;
        }
    </style>
</head>
<body>

<div id="leftSidebar" class="sidebar">
    <a href="index.html" class="sidebar-nav-link logo">Trollbin</a>
    <a href="index.html" class="sidebar-nav-link">Home</a>
    <a href="hunt.html" class="sidebar-nav-link">Hunting</a>
    <a href="price.html" class="sidebar-nav-link">Price</a>
    <a href="addcard.html" class="sidebar-nav-link">Add card</a>
    <a href="chat.html" class="sidebar-nav-link">Chat</a>
</div>

<button class="sidebar-toggle" onclick="toggleSidebar()">&#10095;</button>

<!-- Верхняя панель -->
<div style="position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; pointer-events: none; border-bottom: 1px solid #331111; background: #0d0d0d;">
    <div style="position: relative; width: 100%; height: 60px;">
        <div id="authMenu" style="position: absolute; top: 50%; transform: translateY(-50%); right: 20px; font-family: monospace; display: inline-flex; gap: 8px; align-items: center; pointer-events: auto;"></div>
    </div>
</div>

<main>
    <div class="register-box">
        <h2 style="color: #ff3333; margin-top: 0; font-family: monospace; letter-spacing: 1px;">REGISTER</h2>
        
        <div class="form-group">
            <label>USERNAME</label>
            <input type="text" id="regUsername" placeholder="Введите никнейм...">
        </div>

        <div class="form-group">
            <label>PASSWORD</label>
            <input type="password" id="regPassword" placeholder="Введите пароль...">
        </div>

        <button class="register-btn" onclick="registerUser()">REGISTER</button>
        
        <p style="margin-top: 15px; font-size: 12px; color: #777;">
            Уже есть аккаунт? <a href="login.html" style="color: #ff3333; text-decoration: none;">Войти</a>
        </p>
    </div>
</main>

<!-- Подключаем Supabase SDK -->
<script src="https://cdn.jsdelivr.5npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // Подключение к вашему реальному проекту Supabase
    const SUPABASE_URL = 'https://qndrpwbxkaxntvtevonsj.supabase.co';
    const SUPABASE_ANON_KEY = 'ВАШ_АКТУАЛЬНЫЙ_ANON_КЛЮЧ_ИЗ_SUPABASE'; // Замените на ваш рабочий ключ, если он отличается

    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });

    function toggleSidebar() {
        const sidebar = document.getElementById('leftSidebar');
        const toggleBtn = document.querySelector('.sidebar-toggle');
        sidebar.classList.toggle('open');
        toggleBtn.innerHTML = sidebar.classList.contains('open') ? '&#10094;' : '&#10095;';
    }

    document.addEventListener("DOMContentLoaded", async function() {
        const m = document.getElementById('authMenu');
        const currentUserId = localStorage.getItem('currentUserId');
        
        if (currentUserId && m) {
            try {
                const { data: u, error } = await _supabase
                    .from('users')
                    .select('*')
                    .eq('id', currentUserId)
                    .maybeSingle();

                if (u && !error) {
                    m.innerHTML = `<a href="profile.html?id=${u.id}" style="color: #ff3333; font-family: Arial, sans-serif; font-weight: bold; font-size: 14px; text-decoration: none;">${u.nickname}</a> <span style="color: #444;">/</span> <a href="#" id="logoutBtn" style="color: #888888; font-family: Arial, sans-serif; font-weight: bold; font-size: 14px; text-decoration: none;">Logout</a>`;
                    
                    document.getElementById('logoutBtn').addEventListener('click', function(e) {
                        e.preventDefault();
                        localStorage.removeItem('currentUserId');
                        location.reload();
                    });
                }
            } catch(e) {}
        } else if (m) {
            m.innerHTML = '<a href="login.html" style="color: #888888; font-family: Arial, sans-serif; font-weight: bold; font-size: 14px; text-decoration: none;">Login</a> <span style="color: #444;">/</span> <a href="register.html" style="color: #888888; font-family: Arial, sans-serif; font-weight: bold; font-size: 14px; text-decoration: none;">Register</a>';
        }
    });

    async function registerUser() {
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;

        if (!username || !password) {
            alert('Заполните все поля!');
            return;
        }

        try {
            const { data: existingUsers, error: checkError } = await _supabase
                .from('users')
                .select('id, nickname')
                .eq('nickname', username);

            if (checkError) {
                throw checkError;
            }

            if (existingUsers && existingUsers.length > 0) {
                alert('Пользователь с таким именем уже существует!');
                return;
            }

            const newUserId = 'user_' + Date.now();
            const newUser = {
                id: newUserId,
                nickname: username,
                password: password,
                joined: new Date().toISOString()
            };

            const { error: insertError } = await _supabase
                .from('users')
                .insert([newUser]);

            if (insertError) {
                throw insertError;
            }

            localStorage.setItem('currentUserId', newUserId);
            alert('Регистрация успешна!');
            window.location.href = `profile.html?id=${newUserId}`;

        } catch (err) {
            console.error('Ошибка регистрации:', err);
            alert('Ошибка: ' + (err.message || JSON.stringify(err)));
        }
    }
</script>
</body>
</html>
