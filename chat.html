<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат — TrollBin</title>
    <!-- Подключение клиента Supabase (версия для браузера) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Базовые стили для примера работоспособности интерфейса */
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        #chatContainer { max-width: 600px; margin: 0 auto; background: #1e1e1e; border-radius: 8px; display: flex; flex-direction: column; height: 80vh; overflow: hidden; border: 1px solid #333; }
        #messagesList { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #2a2a2a; padding: 10px; border-radius: 6px; position: relative; border: 1px solid #3a3a3a; }
        .message .author { font-weight: bold; color: #4f46e5; margin-bottom: 4px; }
        .message .text { word-break: break-word; }
        .message .reply-quote { background: #181818; border-left: 3px solid #4f46e5; padding: 4px 8px; font-size: 0.85em; margin-bottom: 6px; color: #aaa; border-radius: 2px; }
        .message button.delete-btn { position: absolute; top: 10px; right: 10px; background: transparent; border: none; color: #ef4444; cursor: pointer; }
        
        #replyPreview { display: none; background: #252525; padding: 8px 12px; align-items: center; justify-content: space-between; border-top: 1px solid #333; font-size: 0.9em; }
        #replyPreview .reply-content { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #aaa; }
        
        #chatForm { display: flex; padding: 10px; background: #1a1a1a; border-top: 1px solid #333; gap: 8px; }
        #chatInput { flex: 1; background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 4px; outline: none; }
        #chatForm button { background: #4f46e5; color: white; border: none; padding: 0 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #chatForm button:hover { background: #4338ca; }
    </style>
</head>
<body>

    <div id="chatContainer">
        <!-- Список сообщений -->
        <div id="messagesList"></div>

        <!-- Превью ответа на сообщение -->
        <div id="replyPreview">
            <div>
                Ответ для <span id="replyUser" style="font-weight: bold; color: #fff;"></span>:
                <div id="replyTextSnippet" class="reply-content"></div>
            </div>
            <button onclick="cancelReply()" style="background:none; border:none; color:#aaa; cursor:pointer; font-size: 1.2em;">&times;</button>
        </div>

        <!-- Форма отправки -->
        <div id="chatForm">
            <input type="text" id="chatInput" placeholder="Введите сообщение (до 300 символов)..." maxlength="300">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

<script>
    // Инициализация Supabase (замените на ваши актуальные ключи проекта)
    const SUPABASE_URL = 'ВАШ_SUPABASE_URL';
    const SUPABASE_KEY = 'ВАШ_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Глобальная переменная для хранения информации о сообщении, на которое отвечают
    let currentReplyTo = null;

    // Функция прокрутки чата вниз
    function scrollToBottom() {
        const list = document.getElementById('messagesList');
        list.scrollTop = list.scrollHeight;
    }

    // Отрисовка сообщений на экране
    function renderMessages(messages) {
        const list = document.getElementById('messagesList');
        list.innerHTML = '';

        messages.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'message';
            
            let replyHtml = '';
            if (msg.reply_to_text) {
                replyHtml = `
                    <div class="reply-quote">
                        <strong>${escapeHtml(msg.reply_to_user || 'Пользователь')}</strong>: ${escapeHtml(msg.reply_to_text)}
                    </div>
                `;
            }

            div.innerHTML = `
                ${replyHtml}
                <div class="author">${escapeHtml(msg.nickname || 'Аноним')}</div>
                <div class="text">${escapeHtml(msg.text)}</div>
                <button class="delete-btn" onclick="deleteMessage('${msg.id}')" title="Удалить">🗑</button>
            `;

            // Клик по сообщению вызывает режим ответа на него
            div.addEventListener('click', (e) => {
                if(e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
                setReply(msg.id, msg.nickname || 'Аноним', msg.text);
            });

            list.appendChild(div);
        });
        scrollToBottom();
    }

    // Простая защита от XSS для вывода текста
    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Установка ответа на сообщение
    function setReply(id, nickname, text) {
        currentReplyTo = { id: id, user: nickname, text: text };
        document.getElementById('replyUser').textContent = nickname;
        document.getElementById('replyTextSnippet').textContent = text;
        document.getElementById('replyPreview').style.display = 'flex';
        document.getElementById('chatInput').focus();
    }

    // Отмена ответа на сообщение
    function cancelReply() {
        currentReplyTo = null;
        document.getElementById('replyPreview').style.display = 'none';
    }

    // Загрузка сообщений из Supabase
    async function fetchMessages() {
        const { data: messages, error } = await supabase
            .from('chat_messages')
            .select('*')
            .order('created_at', { ascending: true });

        if (error) {
            console.error('Ошибка загрузки сообщений:', error);
            return;
        }

        renderMessages(messages);
    }

    // Отправка сообщения в Supabase
    async function sendMessage() {
        const input = document.getElementById('chatInput');
        if (!input) return;
        let text = input.value.trim();
        if (!text) return;

        if (text.length > 300) {
            text = text.substring(0, 300);
        }

        // Проверяем авторизацию через Supabase Auth
        const { data: { user }, error: authError } = await supabase.auth.getUser();

        if (authError || !user) {
            alert('Чтобы писать в чат, необходимо войти в аккаунт!');
            window.location.href = 'login.html';
            return;
        }

        // Получаем никнейм пользователя из таблицы profiles
        const { data: profile } = await supabase
            .from('profiles')
            .select('nickname')
            .eq('id', user.id)
            .single();

        const nickname = profile ? profile.nickname : (user.email ? user.email.split('@')[0] : 'Аноним');

        // Формируем объект нового сообщения
        const newMessage = {
            user_id: user.id,
            nickname: nickname,
            text: text,
            reply_to_id: currentReplyTo ? currentReplyTo.id : null,
            reply_to_text: currentReplyTo ? currentReplyTo.text : null,
            reply_to_user: currentReplyTo ? currentReplyTo.user : null
        };

        const { error } = await supabase
            .from('chat_messages')
            .insert([newMessage]);

        if (error) {
            console.error('Ошибка отправки сообщения:', error);
            alert('Не удалось отправить сообщение.');
            return;
        }

        input.value = '';
        cancelReply();
        await fetchMessages();
    }

    // Удаление сообщения из Supabase
    async function deleteMessage(id) {
        const { error } = await supabase
            .from('chat_messages')
            .delete()
            .eq('id', id);

        if (error) {
            console.error('Ошибка удаления сообщения:', error);
            alert('Не удалось удалить сообщение.');
            return;
        }

        await fetchMessages();
    }

    // Автоматическое обновление чата в реальном времени (Realtime)
    function initChatRealtime() {
        supabase
            .channel('public:chat_messages')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_messages' }, () => {
                fetchMessages();
            })
            .subscribe();
    }

    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', () => {
        fetchMessages();
        initChatRealtime();
        
        // Отправка по нажатию Enter
        document.getElementById('chatInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    });
</script>
</body>
</html>
