<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монгол — Чат</title>
    <!-- Подключаем ваши стили -->
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем библиотеку Supabase для работы с онлайн-базой -->
    <script src="https://cdn.jsdelivr.5npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="chat-container">
        <!-- Шапка чата -->
        <div class="chat-header">
            <h2>Чат проекта Монгол</h2>
        </div>

        <!-- Окно с сообщениями -->
        <div id="chatMessages" class="chat-messages">
            <!-- Сюда динамически подгружаются сообщения -->
        </div>

        <!-- Превью ответа на сообщение -->
        <div id="replyPreview" class="reply-preview" style="display: none;">
            <div class="reply-info">
                Ответ для: <strong id="replyUser"></strong>
                <span id="replyTextSnippet"></span>
            </div>
            <button onclick="cancelReply()">×</button>
        </div>

        <!-- Панель ввода сообщения -->
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Введите сообщение (макс. 300 символов)..." maxlength="300">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ SUPABASE (вставьте ваши ключи)
        // ==========================================
        const SUPABASE_URL = 'ВАШ_URL_ПРОЕКТА';
        const SUPABASE_ANON_KEY = 'ВАШ_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentReplyTo = null;

        // Автозапуск при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            fetchMessages();
        });

        // Прокрутка чата вниз
        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        }

        // Защита от XSS
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Отрисовка сообщений на экране
        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            if (!container) return;

            const currentUserId = localStorage.getItem('currentUserId');
            
            container.innerHTML = messages.map(msg => {
                const isMyMessage = msg.user_id === currentUserId;
                
                return `
                    <div class="message ${isMyMessage ? 'my-message' : ''}">
                        <div class="message-content">
                            ${msg.reply_to_text ? `<div class="quoted"><b>${escapeHtml(msg.reply_to_user || 'Пользователь')}:</b> ${escapeHtml(msg.reply_to_text)}</div>` : ''}
                            <div class="text">${escapeHtml(msg.text)}</div>
                        </div>
                        <div class="message-actions">
                            <button onclick="setReply(${msg.id}, 'Пользователь', '${escapeHtml(msg.text).replace(/'/g, "\\'")}')">Ответить</button>
                            ${isMyMessage ? `<button onclick="deleteMessage(${msg.id})">Удалить</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            scrollToBottom();
        }

        // 1. Загрузка сообщений из Supabase и подписка в реальном времени
        async function fetchMessages() {
            const container = document.getElementById('chatMessages');
            if (!container) return;

            const { data: messages, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('Ошибка загрузки чата:', error);
                return;
            }

            renderMessages(messages);

            // Автообновление (Realtime) для всех устройств
            if (!window._supabaseSubscribed) {
                window._supabaseSubscribed = true;
                supabaseClient
                    .channel('public:messages')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, payload => {
                        fetchMessages();
                    })
                    .subscribe();
            }
        }

        // Установка ответа на сообщение
        function setReply(id, nickname, text) {
            currentReplyTo = { id: id, user: nickname, text: text };
            document.getElementById('replyUser').textContent = nickname;
            document.getElementById('replyTextSnippet').textContent = text;
            document.getElementById('replyPreview').style.display = 'flex';
            document.getElementById('chatInput').focus();
        }

        // Отмена ответа
        function cancelReply() {
            currentReplyTo = null;
            document.getElementById('replyPreview').style.display = 'none';
        }

        // 2. Удаление сообщения из базы данных
        async function deleteMessage(id) {
            const { error } = await supabaseClient
                .from('messages')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Не удалось удалить сообщение');
                console.error(error);
            }
        }

        // 3. Отправка сообщения в общую базу
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            if (!input) return;
            let text = input.value.trim();
            if (!text) return;

            if (text.length > 300) {
                text = text.substring(0, 300);
            }

            const currentUserId = localStorage.getItem('currentUserId');
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const currentUser = users.find(u => u.id === currentUserId);

            if (!currentUser) {
                alert('Чтобы писать в чат, необходимо войти в аккаунт!');
                window.location.href = 'login.html';
                return;
            }

            const { error } = await supabaseClient
                .from('messages')
                .insert([{
                    user_id: currentUser.id,
                    text: text,
                    reply_to_id: currentReplyTo ? currentReplyTo.id : null,
                    reply_to_text: currentReplyTo ? currentReplyTo.text : null,
                    reply_to_user: currentReplyTo ? currentReplyTo.user : null
                }]);

            if (error) {
                alert('Ошибка при отправке сообщения');
                console.error(error);
                return;
            }

            input.value = '';
            cancelReply();
            scrollToBottom();
        }
    </script>
</body>
</html>
